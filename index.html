const STORES=['users','profiles','images','posts','comments','reactions','shares','savedPosts','friendships','friendRequests','blocks','conversations','convMembers','messages','groups','groupMembers','notifications','stories','storyViews','reports','meta'];
const DB=(function(){
  const mem={};STORES.forEach(s=>mem[s]=new Map());
  let dbp=null;
  const ready=new Promise(res=>{
    try{
      if(!window.indexedDB){res(null);return}
      let done=false;const fin=v=>{if(!done){done=true;res(v)}};
      let r;try{r=indexedDB.open('gisthubafrica',3)}catch(e){fin(null);return}
      r.onupgradeneeded=e=>{try{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})}catch(e){}};
      r.onsuccess=()=>{dbp=r.result;fin(dbp)};
      r.onerror=()=>fin(null);r.onblocked=()=>fin(null);

  const w=q=>new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
  return{
    async put(s,o){try{const d=await ready;if(!d)throw 0;await w(d.transaction(s,'readwrite').objectStore(s).put(o))}catch(e){}mem[s].set(o.id,o)},
    async get(s,id){try{const d=await ready;if(!d)throw 0;const r=await w(d.transaction(s,'readonly').objectStore(s).get(id));if(r)mem[s].set(id,r);return r}catch(e){return mem[s].get(id)}},
    async del(s,id){try{const d=await ready;if(!d)throw 0;await w(d.transaction(s,'readwrite').objectStore(s).delete(id))}catch(e){}mem[s].delete(id)},
    async all(s){try{const d=await ready;if(!d)throw 0;const r=await w(d.transaction(s,'readonly').objectStore(s).getAll());r.forEach(o=>mem[s].set(o.id,o));return r}catch(e){return[...mem[s].values()]}}};
})();
const imgCache={};
function imgSrc(ref){if(!ref)return null;if(ref.indexOf('idb:')===0){const id=ref.slice(4);if(imgCache[id])return imgCache[id];const rec=(D.images||[]).find(i=>i.id===id);if(rec&&rec.blob){imgCache[id]=URL.createObjectURL(rec.blob);return imgCache[id]}return null}return ref}
async function blobFromFile(file){
  let src;try{src=await createImageBitmap(file)}catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const sc=Math.min(1,1400/Math.max(src.width,src.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(src.width*sc));c.height=Math.max(1,Math.round(src.height*sc));
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
}
async function addImage(file,kind){
  if(!file||!file.type||file.type.indexOf('image/')!==0)throw new Error('Not an image');

  if(!user||!user.id)return null;
  D.profiles=D.profiles||[];
  let me=D.profiles.find(p=>p.id===user.id);
  const md=user.user_metadata||{};

      if((D.users||[]).some(u=>u.username===un))return{err:'That username is taken.'};

      return{ok:true,uid:u.id,code:u.verifyCode,admin:isFirstReal};
    }
    const un=(f.username||'').trim().toLowerCase();
    if(!/^[a-z0-9_]{3,20}$/.test(un))return{err:'Username must be 3–20 letters, numbers or _ (no spaces).'};
    if(!f.displayName.trim())return{err:'Display name is required.'};
    if((D.users||[]).some(u=>u.username===un))return{err:'That username is taken.'};
    if((f.pass||'').length<8)return{err:'Password must be at least 8 characters.'};
    if(f.pass!==f.pass2)return{err:'Passwords do not match.'};
    const{data,error}=await SB.auth.signUp({email:f.email.trim(),password:f.pass,options:{
      data:{username:un,display_name:f.displayName.trim(),bio:f.bio||'',country:f.country||'',city:f.city||'',gender:f.gender||'',birthday:f.birthday||''}}});
    if(error)return{err:error.message};

  async login(ident,pass){
    if(!REMOTE){
      const q=(ident||'').trim().toLowerCase();
      const u=(D.users||[]).find(x=>x.username===q||x.email===q);
      if(!u)return{err:'No account matches that username or email.'};
      if(u.suspended)return{err:'This account is suspended.'};
      if(isDemo(u.id)){setSession(u);return{ok:true,demo:true}}
      const h=await hashStr(u.salt+':'+pass);
      if(h!==u.passHash)return{err:'Wrong password. Try again.'};
      u.lastSeen=Date.now();await DB.put('users',u);setSession(u);return{ok:true};
    }
    let email=(ident||'').trim().toLowerCase();
    const byName=(D.users||[]).find(u=>u.username===email);
    if(byName&&!byName.demo)email=byName.email||email;
    const{data,error}=await SB.auth.signInWithPassword({email:email,password:pass});
    if(error)return{err:error.message};
    auth.uid=data.user.id;await loadSnapshot();
    ensureAuthProfile(data.user);

  return Object.assign({},u,{id:id,name:u.name||u.displayName||u.username,color:u.color||colorFor(u)})};

const areFriends=(a,b)=>(D.friendships||[]).some(f=>(f.a===a&&f.b===b)||(f.a===b&&f.b===a));
const blockedBetween=(a,b)=>(D.blocks||[]).some(x=>(x.blocker===a&&x.blocked===b)||(x.blocker===b&&x.blocked===a));
const iBlocked=b=>(D.blocks||[]).some(x=>x.blocker===auth.uid&&x.blocked===b);
const pendingReq=(from,to)=>(D.friendRequests||[]).some(r=>r.from===from&&r.to===to);
const friendsOf=id=>(D.friendships||[]).filter(f=>f.a===id||f.b===id).map(f=>f.a===id?f.b:f.a).map(U).filter(Boolean);
const mutualCount=(a,b)=>{const A={};friendsOf(a).forEach(x=>A[x.id]=1);return friendsOf(b).filter(x=>A[x.id]).length};
const gRole=(gid,u_)=>{const m=(D.groupMembers||[]).find(m=>m.gid===gid&&m.uid===u_);return m&&m.status==='active'?m.role:(m?'pending':null)};
const reactionsOf=pid=>(D.reactions||[]).filter(r=>r.postId===pid);
const myReaction=pid=>{const r=reactionsOf(pid).find(r=>r.uid===auth.uid);return r?r.type:null};

const commentsOf=pid=>(D.comments||[]).filter(c=>c.postId===pid&&!c.parentId).sort((a,b)=>a.createdAt-b.createdAt);

function reactSummary(p){const sum={};RKEYS.forEach(k=>sum[k]=(p.baseStats&&p.baseStats[k])||0);
  reactionsOf(p.id).forEach(r=>sum[r.type]=(sum[r.type]||0)+1);
  const keys=RKEYS.filter(k=>sum[k]>0).sort((a,b)=>sum[b]-sum[a]);
  return{sum:sum,keys:keys,total:keys.reduce((a,k)=>a+sum[k],0)}}

  if(p.uid===v)return true;

  const ou=U(p.uid);if(!ou||ou.suspended)return false;
  if(p.privacy==='me')return v?p.uid===v:false;

async function freshenDemo(){

  for(const s of['posts','comments','conversations','messages','notifications','stories'])
    for(const r of D[s]||[])if(r.demo&&r.createdAt){r.createdAt+=delta;await DB.put(s,r)}

}
async function wipeDemo(){

    shares:r=>r.demo,friendships:r=>r.demo||isDemo(r.a)||isDemo(r.b),friendRequests:r=>r.demo||isDemo(r.from)||isDemo(r.to),
    conversations:r=>r.demo,convMembers:r=>r.demo||isDemo(r.uid),messages:r=>r.demo||isDemo(r.uid),
    groups:r=>r.demo,groupMembers:r=>r.demo||isDemo(r.uid),notifications:r=>r.demo||isDemo(r.actorId)||isDemo(r.uid),
    stories:r=>r.demo,storyViews:r=>r.demo||isDemo(r.viewer),savedPosts:r=>isDemo(r.uid)};

function pop(id,html,anchor,place){const ex=document.querySelector('.popover[data-for="'+id+'"]');closePops();if(ex)return null;
  const p=document.createElement('div');p.className='popover';p.setAttribute('data-for',id);p.innerHTML=html;document.body.appendChild(p);
  const r=anchor.getBoundingClientRect(),pw=p.offsetWidth,ph=p.offsetHeight;
  if(place==='up'){p.style.left=Math.max(10,r.left)+'px';p.style.top=Math.max(10,r.top-ph-10)+'px'}
  else if(place==='right'){p.style.left=Math.min(r.right+10,innerWidth-pw-10)+'px';p.style.top=Math.min(r.top,innerHeight-ph-10)+'px'}
  else{p.style.left=Math.max(10,Math.min(r.left,innerWidth-pw-10))+'px';p.style.top=Math.min(r.bottom+8,innerHeight-ph-10)+'px'}return p}

function playSeg(){clearTimeout(storyTimer);sPaused=false;
  const f=storyEl&&storyEl.querySelector('.seg i');if(!f)return;
  f.style.transition='none';f.style.width='0%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transition='width '+SDUR+'ms linear';f.style.width='100%'}));
  storyTimer=setTimeout(storyNext,SDUR)}
function pauseStory(){if(!storyEl||sPaused)return;sPaused=true;clearTimeout(storyTimer);
  const f=storyEl.querySelector('.seg i'),s=f.parentElement;
  f.style.transition='none';f.style.width=(f.getBoundingClientRect().width/s.getBoundingClientRect().width*100)+'%'}
function resumeStory(){if(!sPaused||!storyEl)return;sPaused=false;
  const f=storyEl.querySelector('.seg i'),s=f.parentElement;
  const rem=SDUR*(1-f.getBoundingClientRect().width/s.getBoundingClientRect().width);
  f.style.transition='width '+Math.max(rem,50)+'ms linear';f.style.width='100%';
  storyTimer=setTimeout(storyNext,Math.max(rem,50))}
function storyNext(){const sts=activeStories();const si=sts.findIndex(s=>s.uid===storyPos.uid);if(si<0)return closeStory();

  else closeStory()}

  const old=b?b.textContent:'Log in';
  if(b){b.disabled=true;b.textContent='Logging in…'}
  try{
    const r=await Promise.race([
      api.login(ident,pass),
      new Promise(resolve=>setTimeout(()=>resolve({err:'Login is taking too long. Please try again.'}),20000))
    ]);
    if(r.err)return toast(r.err,'x');
    if(r.demo)toast('Exploring as Emmanuel (demo)','sparkle');
    await loadSnapshot();renderAll();toast('Welcome back!','check');
  }catch(e){
    console.error('[GHA] login failed:',e);
    toast((e&&e.message)||'Login failed. Please try again.','x');

 'group-edit-save'(t){(async()=>{const r=await api.updateGroup(t.getAttribute('data-id'),{name:document.getElementById('geN').value.trim(),desc:document.getElementById('geD').value.trim(),privacy:document.getElementById('geP').value});

 'ava-upload'(){pickFile(async f=>{try{const url=await addImage(f,'avatars');

 'cov-upload'(){pickFile(async f=>{try{const url=await addImage(f,'covers');

 'story-new'(){openStoryComposer()},

 'story-photo'(){pickFile(async f=>{try{state.storyDraft.img=await addImage(f,'stories');const sv=document.getElementById('svp');if(sv)sv.style.backgroundImage='url('+imgSrc(state.storyDraft.img)+')'}catch(e){}})},
 'story-post'(){(async()=>{const txt=(document.getElementById('storyText')||{}).value||'';

 'story-open'(t){storyPos.uid=t.getAttribute('data-uid');storyPos.ii=0;renderStory()},

 'story-views'(t){const vs=(D.storyViews||[]).filter(v=>v.storyId===t.getAttribute('data-sid'));
  pop('sv','<div class="pop-h"><b>Story views</b><span style="font-size:12px;color:var(--muted)">'+vs.length+'</span></div>'+

 bell(t){const list=(D.notifications||[]).filter(n=>n.uid===auth.uid).sort((a,b)=>b.createdAt-a.createdAt).slice(0,20);
  pop('bell','<div class="pop-h"><b>Notifications</b><button class="lnk" data-action="markread">Mark all read</button></div>'+
  '<div class="nlist">'+(list.map(n=>{const a=U(n.actorId);
   return'<button class="nrow '+(n.read?'':'un')+'" data-action="notif-open" data-id="'+n.id+'">'+
   (a?avatar(a,36):'<span class="nico">'+icon('bell','s')+'</span>')+
   '<span class="ntx"><b>'+esc(a?a.name:'GistHubAfrica')+'</b> '+esc(n.text)+' <span class="ts" data-ts="'+n.createdAt+'">'+ago(n.createdAt)+'</span></span>'+
   (n.read?'':'<i class="ndot"></i>')+'</button>'}).join('')||'<p style="padding:16px;color:var(--muted)">Nothing yet — go and make some noise.</p>')+'</div>'+
  '<div class="pop-foot">That is everything for now.</div>',t)},
 markread(){(async()=>{await api.markAllRead();await loadSnapshot();
  const b=document.querySelector('[data-action="bell"]');if(b)ACTIONS.bell(b);updateBadges()})()},
 'notif-open'(t){(async()=>{await api.markNotifRead(t.getAttribute('data-id'));
  const n=(D.notifications||[]).find(x=>x.id===t.getAttribute('data-id'));
  closePops();await loadSnapshot();
  if(n&&n.ref){
   if(n.ref.k==='post')goFeedAndFlash(n.ref.id);
   else if(n.ref.k==='friends'){state.view='friends';state.ftab='requests';renderMain()}
   else if(n.ref.k==='chat'){const c=(D.conversations||[]).find(x=>x.id===n.ref.id);const p=c&&convPartner(c);if(p)openChatWith(p.id)}
   else if(n.ref.k==='group'){state.view='group';state.gid=n.ref.id;renderMain()}}
  updateBadges()})()},
 'jump-post'(t){goFeedAndFlash(t.getAttribute('data-id'))},
};
window.gistHubLogin=function(btn){return ACTIONS.login(btn)};

/* ---------- global listeners ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!e.target.closest('.searchwrap')){const qr=document.getElementById('qres');if(qr)qr.hidden=true}
  if(!e.target.closest('.popover')&&!(t&&t.hasAttribute('data-pop')))closePops();
  if(!t)return;
  const fn=ACTIONS[t.getAttribute('data-action')];if(fn)fn(t,e)});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='compText'){state.composer.text=el.value;el.style.height='auto';el.style.height=el.scrollHeight+'px';
   const b=document.querySelector('[data-action="comp-post"]');if(b)b.disabled=!el.value.trim()&&!state.composer.img}
  else if(el.classList&&el.classList.contains('cinput'))state.drafts[el.getAttribute('data-post')]=el.value;
  else if(el.id==='storyText'){state.storyDraft.text=el.value;const pt=document.getElementById('svpt');if(pt)pt.textContent=el.value||'Start typing…';const go=document.getElementById('storyGo');if(go)go.disabled=!el.value.trim()&&!state.storyDraft.img}});
document.getElementById('filepick').addEventListener('change',e=>{const f=e.target.files[0];if(f&&pickCb)pickCb(f,pickCtx);e.target.value=''});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
   if(e.target.classList&&e.target.classList.contains('cinput')){e.preventDefault();ACTIONS.commentSend(e.target.getAttribute('data-post'),e.target)}
   else if(e.target.classList&&e.target.classList.contains('chin')){e.preventDefault();ACTIONS.msgSend(e.target.getAttribute('data-cid'),e.target)}}
  if(e.key==='Escape'){if(storyEl)closeStory();else{closeModal();closePops();document.querySelectorAll('.lb').forEach(x=>x.remove())}}
  if(storyEl&&e.key==='ArrowRight')storyNext();
  if(storyEl&&e.key==='ArrowLeft')storyPrev();
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();const q=document.getElementById('q');if(q)q.focus()}});
let hT=null;
document.addEventListener('pointerover',e=>{const w=e.target.closest('.react-wrap');clearTimeout(hT);
  if(w){if(!w.classList.contains('show'))hT=setTimeout(()=>w.classList.add('show'),350)}
  else document.querySelectorAll('.react-wrap.show').forEach(x=>x.classList.remove('show'))});
document.addEventListener('pointerdown',e=>{
  if(storyEl&&e.target.closest('.sv-stage')){sPauseT=setTimeout(pauseStory,170);return}
  if(e.pointerType!=='mouse'){const b=e.target.closest('[data-action="like"]');
   if(b){const w=b.closest('.react-wrap');hT=setTimeout(()=>{if(w)w.classList.add('show')},350)}}});
document.addEventListener('pointerup',()=>{clearTimeout(hT);if(sPaused)resumeStory();else clearTimeout(sPauseT)});
window.addEventListener('scroll',()=>{closePops();document.querySelectorAll('.react-wrap.show').forEach(x=>x.classList.remove('show'))},{passive:true});
window.addEventListener('resize',closePops);
setInterval(()=>{document.querySelectorAll('[data-ts]').forEach(el=>{el.textContent=ago(+el.getAttribute('data-ts'))})},30000);
setInterval(async()=>{if(!auth.uid)return;
  try{if(REMOTE){await loadSnapshot()}else{await api.touch();await loadSnapshot()}
   updateBadges();renderDock(true)}catch(e){}},5000);
setInterval(()=>{api.touch()},60000);
window.addEventListener('error',e=>console.error('[GHA]',e.message));
window.addEventListener('unhandledrejection',e=>console.error('[GHA]',e.reason));

/* ---------- boot (guarded — never blank) ---------- */
function fatalScreen(err){
  console.error('[GistHubAfrica] boot failed:',err);
  document.getElementById('app').innerHTML='<div class="authwrap"><div class="authside"><div class="card auth"><div class="kente"></div><div class="auth-in"><h2>Almost there</h2><p class="sub">The app could not fully start (check the console for details). Reload to continue.</p><button class="btn pri" style="width:100%" onclick="location.reload()">Reload GistHubAfrica</button></div></div></div></div>'}
async function boot(){
  if(REMOTE){
    const r=await initRemote();
    if(r&&r.err){await loadSnapshot();renderAll();toast(r.err,'x');return}
    await loadSnapshot();renderAll();wireRealtime();return;
  }
  await loadSnapshot();
  const meta=(await DB.get('meta','meta'))||{id:'meta'};
  if(!meta.seeded&&!meta.demoRemoved){await seedDemo();await loadSnapshot()}
  else{await freshenDemo();await loadSnapshot()}
  const s=getSession();
  if(s){const u=await DB.get('users',s.uid);
   if(!u||(u.suspended&&!isDemo(u.id))){clearSession()}
   else{auth.uid=u.id;u.lastSeen=Date.now();await DB.put('users',u)}}
  else{const em=await DB.get('users','demo_emmanuel');
   if(em&&!meta.demoRemoved){setSession(em);auth.uid=em.id}}
  renderAll()}
(async function init(){
  try{if(LS.get('gha-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}
  try{await boot()}
  catch(err){fatalScreen(err)}
})();
