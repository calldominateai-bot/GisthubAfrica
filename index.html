.chatlist{width:320px;max-width:calc(100vw - 32px);max-height:430px;overflow-y:auto}

.ntx{font-size:13.5px;line-height:1.4;color:var(--ink2)}

.ndot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex:none}
.emojig{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:8px}

.field{margin-bottom:12px}

.authnote{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5;max-width:460px;margin-left:auto;margin-right:auto}

.codebig{font-family:'Bricolage Grotesque';font-size:34px;font-weight:800;letter-spacing:.14em;text-align:center;background:var(--bg);border:1px dashed var(--gold);border-radius:12px;padding:14px 0;margin-bottom:12px;color:var(--primary)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:'Bricolage Grotesque';font-size:24px;font-weight:800;color:var(--primary)}
.stat span{font-size:12px;color:var(--muted);font-weight:650}
.reprow{border-top:1px solid var(--line2);padding:12px 2px}

.reprow .rb{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.lb{background:rgba(18,12,6,.9)}

.lb-x{position:fixed;top:18px;right:18px;width:44px;height:44px;border-radius:50%;background:rgba(255,246,232,.12);color:#FFF3E4;display:grid;place-items:center}
.lb-x:hover{background:rgba(255,246,232,.22)}
.story-v{position:fixed;inset:0;z-index:85;background:rgba(16,11,7,.95);display:grid;place-items:center}
.sv{position:relative;width:min(420px,100vw);height:min(90vh,740px);border-radius:18px;overflow:hidden;background:#1C150D;box-shadow:var(--shadow-lg)}
.segs{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:6}
.seg{flex:1;height:3px;border-radius:99px;background:rgba(255,244,226,.3);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:#FFF4E2;border-radius:99px}
.sv-row{position:absolute;top:24px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:6;color:#FFF4E2}

.sv-views{position:absolute;top:62px;right:12px;z-index:6;color:#FFF4E2;font-size:12.5px;font-weight:700;background:rgba(20,12,6,.45);border-radius:999px;padding:4px 11px}
.sv-stage{position:absolute;inset:0;display:grid;place-items:center;user-select:none}
.sv-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.sv-cap{position:absolute;bottom:0;left:0;right:0;padding:34px 18px 22px;background:rgba(20,12,6,.55);color:#FFF4E2;font-size:15.5px;font-weight:600}

.sv-nav.l .ic{left:8px;transform:rotate(90deg)}.sv-nav.r .ic{right:8px}
.sv:hover .sv-nav .ic{opacity:1}
.sv-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:rgba(255,244,226,.65);font-size:11.5px;z-index:6;pointer-events:none}
.svprev{border-radius:14px;height:260px;display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:12px;background-size:cover;background-position:center}
.svprev p{font-family:'Bricolage Grotesque';font-weight:800;font-size:21px;text-align:center;padding:0 26px}
.bgopts{display:flex;gap:10px;margin-bottom:14px}
.bgopt{width:44px;height:56px;border-radius:10px;border:2px solid transparent;overflow:hidden;position:relative;transition:transform .15s}
.bgopt.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--gold)}
.bgopt .kente{position:absolute;bottom:0;left:0;right:0}
#toasts{position:fixed;left:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:14px;font-weight:600;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.2);max-width:340px}
.toast .ic{color:var(--gold);width:18px;height:18px}
.toast button{color:var(--gold);font-weight:800;margin-left:4px;white-space:nowrap}
.toast.out{animation:toastOut .3s forwards}
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);box-shadow:0 -2px 12px rgba(28,25,18,.1);z-index:55;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:10.5px;font-weight:700}
.bnav button.on{color:var(--primary)}
.bnav .bcreate{flex:0 0 auto;width:52px;height:52px;margin:-26px 6px 0;border-radius:50%;background:var(--primary);color:#FFF6E8;display:grid;place-items:center;box-shadow:0 6px 16px rgba(194,73,29,.4);border:3px solid var(--card)}
.bnav .bcreate span{display:none}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.vcell{border-radius:14px;overflow:hidden;background:var(--card2);cursor:zoom-in;position:relative;aspect-ratio:4/3}
.vcell img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.vcell:hover img{transform:scale(1.04)}
.vcell .vcap{position:absolute;left:0;right:0;bottom:0;padding:20px 12px 10px;background:linear-gradient(transparent,rgba(20,12,6,.75));color:#FFF6E8;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newspost{display:flex;gap:12px;align-items:flex-start;padding:11px 6px;border-radius:12px;transition:background .14s;text-align:left;width:100%}
.newspost:hover{background:var(--card2)}
.newspost .nt{flex:1;min-width:0}
.newspost .nt b{display:block;font-size:14.5px;line-height:1.35}
.newspost .nt span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.stories-empty{padding:18px 4px 8px;color:var(--muted);font-size:13.5px;font-weight:650;text-align:center}
.bnav .nbadge{top:0;right:calc(50% - 20px)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.97)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-24px)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-24px)}}
@keyframes tb{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@keyframes flashB{0%,55%{box-shadow:0 0 0 3px var(--gold),var(--shadow)}100%{box-shadow:var(--shadow)}}
@keyframes burstUp{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translate(var(--dx),-95px) scale(1.35) rotate(var(--rot))}}
/* ---------- home feed enrichment (polish only — no layout redesign) ---------- */

.evrow{display:flex;gap:11px;align-items:center;padding:7px 0;border-radius:10px}

.avwrap{position:relative;flex:none}

.lgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.lgist{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px;display:flex;gap:13px;align-items:center;transition:transform .16s,box-shadow .16s}
.lgist:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

.lgist .lgt b{display:block;font-size:14.5px;line-height:1.45}

.ldemo{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);background:rgba(223,163,43,.12);padding:1px 7px;border-radius:99px;vertical-align:middle}
.lcomm{background:var(--card);border:1px solid var(--line2);border-radius:16px;overflow:hidden;transition:transform .16s,box-shadow .16s}
.lcomm:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.lcomm .lcim{height:110px;background:var(--card2)}
.lcomm .lcim img{width:100%;height:100%;object-fit:cover}
.lcomm .lc-b{padding:12px 14px}

.lcomm .lc-b span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.lvid{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:4/3;background:var(--card2)}
.lvid img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.lvid:hover img{transform:scale(1.05)}
.lvid .lplay{position:absolute;top:10px;left:10px;background:rgba(20,12,6,.6);color:#FFF6E8;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:750;display:inline-flex;gap:6px;align-items:center}
.lpeople{display:flex;gap:16px;flex-wrap:wrap}

.lperson b{display:block;font-size:13.5px;margin-top:9px}

/* ===================== ADMIN DASHBOARD & USER MANAGEMENT =====================
   Access is verified against profiles.is_admin in the database on every entry
   (verifyAdmin). Renders and admin actions are gated client-side here; run the
   RLS hardening SQL in Admin → Settings to enforce the same rules server-side. */
const adminState={ok:false,at:0,raw:null,hasLoginCol:false,hasEmailCol:false,hasGroupSuspCol:false,logsDB:null};
async function verifyAdmin(force){
  if(!auth.uid){adminState.ok=false;return false}
  if(!force&&Date.now()-adminState.at<60000)return adminState.ok;
  adminState.at=Date.now();
  if(!REMOTE){adminState.ok=(ME()||{}).role==='admin';return adminState.ok}
  try{
    const{data,error}=await SB.from('profiles').select('*').eq('id',auth.uid).maybeSingle();
    if(error)throw error;
    adminState.ok=!!(data&&data.is_admin===true);
    if(data){const m=mapProfile(data);const i=(D.profiles||[]).findIndex(p=>p.id===data.id);
      if(i>=0)D.profiles[i]=Object.assign(D.profiles[i],m);else D.profiles.push(m);D.users=D.profiles}
  }catch(e){console.error('[GHA] admin verify:',e.message);adminState.ok=(ME()||{}).role==='admin'}
  return adminState.ok}
async function adminLoadSchema(){
  if(!REMOTE||!SB)return;
  try{
    const{data,error}=await SB.from('profiles').select('*').limit(500);
    if(!error&&data){adminState.raw={};data.forEach(r=>adminState.raw[r.id]=r);
      adminState.hasLoginCol=data.some(r=>'login_disabled'in r);adminState.hasEmailCol=data.some(r=>'email'in r)}
    const g=await SB.from('groups').select('*').limit(1);
    adminState.hasGroupSuspCol=!!(g.data&&g.data[0]&&'suspended'in g.data[0]);
  }catch(e){console.error('[GHA] admin schema:',e.message)}}
function adminGate(){
  if(state.view!=='admin')return true;
  if(adminState.ok||(!REMOTE&&(ME()||{}).role==='admin'))return true;
  state.view='feed';toast('Admins only — that area is restricted.','shield');return false}

    SB.from('admin_logs').insert({admin_id:auth.uid,action:action,target_type:type||'',target_id:id||'',detail:detail||''})

const ADM_SQL={
auditLog:"create table if not exists public.admin_logs(\n  id uuid primary key default gen_random_uuid(),\n  admin_id uuid references auth.users(id) on delete set null,\n  action text not null, target_type text, target_id text, detail text,\n  created_at timestamptz default now());\nalter table public.admin_logs enable row level security;\ncreate policy \"admins read logs\" on public.admin_logs\n  for select using (exists(select 1 from public.profiles p where p.id=auth.uid() and p.is_admin));\ncreate policy \"admins insert logs\" on public.admin_logs\n  for insert with check (exists(select 1 from public.profiles p where p.id=auth.uid() and p.is_admin));",
rls:"-- Enforce the admin role server-side (run once in Supabase SQL editor)\nalter table public.profiles enable row level security;\ncreate policy \"profiles readable\" on public.profiles for select using (true);\ncreate policy \"own profile update\" on public.profiles for update\n  using (auth.uid()=id)\n  with check (auth.uid()=id and (is_admin,suspended,login_disabled)\n    = (select (p.is_admin,p.suspended,p.login_disabled) from public.profiles p where p.id=id));\ncreate policy \"admin manages profiles\" on public.profiles for update\n  using (exists(select 1 from public.profiles p where p.id=auth.uid() and p.is_admin))\n  with check (exists(select 1 from public.profiles p where p.id=auth.uid() and p.is_admin) and id<>auth.uid());\nalter table public.reports enable row level security;\ncreate policy \"signed-in can report\" on public.reports for insert with check (auth.uid() is not null);\ncreate policy \"admins read reports\" on public.reports for select using (exists(select 1 from public.profiles p where p.id=auth.uid() and p.is_admin));\ncreate policy \"admins update reports\" on public.reports for update using (exists(select 1 from public.profiles p where p.id=auth.uid() and p.is_admin));",
columns:"alter table public.profiles add column if not exists email text;\nalter table public.profiles add column if not exists login_disabled boolean default false;\nalter table public.groups add column if not exists suspended boolean default false;\nupdate public.profiles p set email=u.email from auth.users u where u.id=p.id and (p.email is null or p.email='');\ncreate or replace function public.sync_profile_email() returns trigger language plpgsql security definer as $$\nbegin update public.profiles set email=new.email where id=new.id; return new; end $$;\ndrop trigger if exists trg_sync_email on auth.users;\ncreate trigger trg_sync_email after insert or update of email on auth.users\n  for each row execute function public.sync_profile_email();",
marketplace:"create table if not exists public.marketplace_listings(\n  id uuid primary key default gen_random_uuid(),\n  user_id uuid references public.profiles(id) on delete cascade,\n  title text not null, price text, category text, location text,\n  description text, photo_url text,\n  created_at timestamptz default now());\nalter table public.marketplace_listings enable row level security;\ncreate policy \"listings readable\" on public.marketplace_listings for select using (true);\ncreate policy \"own listings insert\" on public.marketplace_listings for insert with check (auth.uid()=user_id);\ncreate policy \"own listings delete\" on public.marketplace_listings for delete using (auth.uid()=user_id);\ncreate policy \"admins manage listings\" on public.marketplace_listings for delete using (exists(select 1 from public.profiles p where p.id=auth.uid() and p.is_admin));"};
function admSettings(){
  const sqlCard=(key,title,desc)=>'<div class="acard"><div class="acard-h"><b>'+title+'</b><button class="btn sm ghost" data-action="adm-copy" data-key="'+key+'">'+icon('link','xs')+' Copy SQL</button></div><p class="muted" style="font-size:13px">'+desc+'</p><pre class="asql">'+esc(ADM_SQL[key])+'</pre></div>';
  return'<div class="acard"><div class="acard-h"><b>Admin role system</b>'+admBadge('admin')+'</div>'+
  '<p class="muted" style="font-size:13.5px;line-height:1.6">Admins are defined by <code>profiles.is_admin</code> in the database. Every entry into this panel re-verifies your role with a fresh database query, and the Admin link only appears for admins. <b>Your database already enforces row-level security</b> — signed-in users can only write their own rows, so nobody can tamper with accounts or content from outside the app. Grant admins their management powers by running the “Server-side role enforcement” SQL below once (Supabase dashboard → SQL editor). Until then the database blocks cross-user admin writes, and the panel will say so instead of pretending.</p></div>'+
  sqlCard('columns','Optional columns + email sync','Adds profiles.email (auto-synced from auth.users), profiles.login_disabled (separate suspend vs disable-login switches) and groups.suspended. The admin UI detects and uses these automatically once they exist.')+
  sqlCard('auditLog','Audit trail table','Creates the shared admin_logs table so every admin action is persisted for all admins. Until then, the Activity Log is stored in this browser only.')+
  sqlCard('marketplace','Marketplace table','Creates the marketplace_listings table so users can publish real product and service listings with photos, prices and locations. The Marketplace page detects it automatically.')+
  sqlCard('rls','Server-side role enforcement (RLS)','Makes profiles role/suspension changes and reports moderation admin-only at the database level, blocks self-demotion/self-suspension, and keeps normal profile updates working for regular users.')+
  '<div class="acard"><div class="acard-h"><b>Deleting accounts</b>'+admBadge('suspended')+'</div><p class="muted" style="font-size:13.5px;line-height:1.6">"Delete account" removes the user\'s gists, comments, stories, friendships, group memberships and notifications, then deactivates and anonymises the profile. Fully removing the auth record requires the service-role key — run <code>delete from auth.users where id=\'…\'</code> in the Supabase dashboard if a hard delete is ever required.</p></div>'}

/* A signed-in Supabase user whose profiles row is missing or not yet visible
   still gets a working in-app profile built from the session, instead of being
   bounced back to the login screen; the missing row is repaired in the background. */
function remoteFallbackProfile(){
  const u=auth.user;if(!u||!u.id)return null;
  const m=u.user_metadata||{};
  return{id:u.id,username:m.username||('user_'+u.id.slice(0,8)),name:m.display_name||m.username||(u.email||'Member').split('@')[0],
    displayName:m.display_name||m.username||null,bio:'',country:'',city:'',gender:'',birthday:'',photoId:null,coverId:null,
    verified:!!u.email_confirmed_at,suspended:false,demo:false,mutualBase:null,role:'user',createdAt:ms(u.created_at),lastSeen:Date.now()}}
async function repairRemoteProfile(p){
  try{const{error}=await SB.from('profiles').insert({id:p.id,username:p.username,display_name:p.name,verified:p.verified});
    if(error)console.error('[GHA] profile repair:',error.message)}catch(e){console.error('[GHA] profile repair:',e&&e.message)}}
function renderAll(){
  if(!auth.uid){renderAuth();document.getElementById('dock').innerHTML='';const b=document.getElementById('bnav');if(b)b.innerHTML='';return}
  let me=ME();
  if(!me){me=REMOTE?remoteFallbackProfile():null;
    if(me){D.profiles=(D.profiles||[]).concat([me]);D.users=D.profiles;repairRemoteProfile(me)}
    else{clearSession();auth.uid=null;renderAuth();return}}
  try{buildTop()}catch(err){console.error('[GHA] top render failed:',err);return}
  const sh=document.querySelector('.shell');if(sh)sh.classList.toggle('adminshell',state.view==='admin');
  renderMain();
  if(state.view!=='admin'){try{buildRight()}catch(err){console.error('[GHA] right render failed:',err)}}
  else{const rb=document.getElementById('rightbar');if(rb)rb.innerHTML=''}
  try{renderDock(true)}catch(err){console.error('[GHA] dock render failed:',err)}}

const landingState={loaded:false,posts:[],groups:[],people:[],imgs:[]};
async function landingLoad(){
  if(landingState.loaded||!REMOTE||!SB)return;
  try{
    const one=async(t,ord,lim)=>{let q=SB.from(t).select('*').limit(lim);if(ord)q=q.order(ord[0],{ascending:!!ord[1]});const{data}=await q;return data||[]};
    const[posts,groups,profiles]=await Promise.all([one('posts',['created_at',false],12),one('groups',['created_at',true],6),one('profiles',null,80)]);
    landingState.posts=posts.map(mapPost);
    landingState.groups=groups.map(r=>({id:r.id,name:r.name,cat:r.category||'General',privacy:r.privacy,photoId:r.photo_url||null,membersBase:r.members_base||0}));
    landingState.people=profiles.filter(p=>p.photo_url).slice(0,12).map(mapProfile);
    landingState.imgs=landingState.posts.filter(p=>(p.images||[]).length).slice(0,8);
    landingState.loaded=true;
    if(!auth.uid&&document.getElementById('authBody'))renderAuth();
  }catch(e){console.error('[GHA] landing load:',e.message)}}
function lSec(id,ic,title,sub,body){return'<section class="lsec" id="'+id+'"><div class="lsec-h">'+icon(ic,'l')+'<div><b>'+title+'</b><span>'+sub+'</span></div></div>'+body+'</section>'}
const L_USER_CACHE={};
function lUser(uid_){if(!L_USER_CACHE[uid_])L_USER_CACHE[uid_]={name:'Member',photoId:null};return L_USER_CACHE[uid_]}
function renderAuth(){const L=landingState;
  const lFind=p=>{const u=L.people.find(x=>x.id===p.uid);return u||lUser(p.uid)};
  const gists=L.posts.slice(0,4).map(p=>{const u=lFind(p);
    return'<div class="lgist">'+((p.images||[]).length?'<span class="lgim"><img src="'+esc(imgSrc(p.images[0])||'')+'" alt="" loading="lazy" onerror="this.style.display=\'none\'"></span>':'')+
    '<div class="lgt"><b>'+esc((p.text||'').replace(/\n/g,' ').slice(0,110))+(p.demo?' <span class="ldemo">demo</span>':'')+'</b>'+
    '<span>'+esc(first(u.name))+' · '+ago(p.createdAt)+' · '+fmtN(cCountLand(p))+' comments</span></div></div>'}).join('');
  const comms=L.groups.map(g=>'<div class="lcomm"><span class="lcim">'+(g.photoId?'<img src="'+esc(imgSrc(g.photoId)||'')+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':'')+'</span><div class="lc-b"><b>'+esc(g.name)+'</b><span>'+fmtN(g.membersBase)+' members · '+esc(g.cat)+'</span></div></div>').join('');
  const vids=L.imgs.map(p=>'<div class="lvid">'+(p.images?'<img src="'+esc(imgSrc(p.images[0])||'')+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':'')+'<span class="lplay">'+icon('play','xs')+' Video gist</span></div>').join('');
  const people=L.people.slice(0,8).map(u=>'<div class="lperson">'+avatar(u,64)+'<b>'+esc(first(u.name))+'</b><span>'+esc(u.city||u.country||'Africa')+'</span></div>').join('');
  const brand='<svg class="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#C2491D"/><path d="M10 10.5h12a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-6.5L12 22v-3.5h-2a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z" fill="#FFFCF4"/></svg>';
  document.getElementById('app').innerHTML=
  '<div class="landing">'+
  '<nav class="lnav">'+
   '<button class="brand" data-action="land-top">'+brand+'<span class="brand-name">GistHub<span class="brand-a">Africa</span></span></button>'+
   '<div class="lnav-links">'+
    '<button data-action="land-scroll" data-to="l-sec-gists">Home</button>'+
    '<button data-action="land-scroll" data-to="l-sec-comm">Communities</button>'+
    '<button data-action="land-scroll" data-to="l-sec-gists">Explore</button>'+
    '<button data-action="land-scroll" data-to="l-sec-vids">Videos</button>'+
    '<button data-action="land-info" data-k="about">About</button>'+
   '</div>'+
   '<div class="lnav-cta"><button class="btn ghost sm" data-action="land-login">Log In</button><button class="btn pri sm" data-action="land-cta">Sign Up</button></div>'+
  '</nav>'+
  '<header class="lhero">'+
   '<div class="lhero-l">'+
    '<div class="leyebrow">— Africa\u2019s social hub</div>'+
    '<h1>Africa in <span class="lgrad">One Hub</span></h1>'+
    '<p class="lsub">Connect, share stories, discover communities, watch videos, explore trends, and grow with people across Africa and the diaspora.</p>'+
    '<div class="lbtns"><button class="btn pri" data-action="land-cta">'+icon('plus','s')+' Create Free Account</button><button class="btn ghost" data-action="land-scroll" data-to="l-sec-gists">'+icon('compass','s')+' Explore Gists</button></div>'+
    (HERO_IMG?'<img class="lphoto" src="'+HERO_IMG+'" alt="Africans in beautiful attire sharing a moment on GistHubAfrica">':'')+
    '<div class="lfeats"><span>'+icon('check','s')+' Free forever</span><span>'+icon('users','s')+' Communities</span><span>'+icon('store','s')+' Marketplace</span><span>'+icon('play','s')+' Videos</span></div>'+
   '</div>'+
   '<div class="lhero-r"><div class="card auth"><div class="kente"></div><div class="auth-in"><div id="authBody"></div></div></div></div>'+
  '</header>'+
  lSec('l-sec-gists','tag','Trending Gists','What Africa is talking about right now',
    '<div class="lgrid2">'+(gists||'<p style="color:var(--muted)">Loading gists…</p>')+'</div>')+
  lSec('l-sec-comm','users','Communities','Find your people — jollof debates, Afrobeats, tech and more',
    '<div class="lgrid3">'+(comms||'<p style="color:var(--muted)">Loading communities…</p>')+'</div>')+
  lSec('l-sec-vids','play','Videos','Visual gists from across the continent',
    '<div class="lgrid4">'+(vids||'<p style="color:var(--muted)">Loading videos…</p>')+'</div>')+
  lSec('l-sec-market','store','Marketplace','Buy and sell across Africa',
    '<div class="lmarket-note"><b>Marketplace is rolling out.</b> List products and services with photos, prices and locations — create your free account now and be first in line when it opens.</div>')+
  lSec('l-sec-people','users','Meet People Across Africa','From Lagos to Nairobi, Accra to the diaspora',
    '<div class="lpeople">'+(people||'<p style="color:var(--muted)">Loading members…</p>')+'</div>')+
  '<div class="lcta"><div class="lcta-in"><h3>Share Your Story</h3><p>Your gist matters. Post it once — Africa hears it everywhere. Free account, your username, your voice.</p><button class="btn pri" data-action="land-cta">'+icon('sparkle','s')+' Create Free Account</button></div></div>'+
  '<footer class="lfoot"><span>GistHubAfrica © 2025 · Made with love across Lagos, Accra, Nairobi &amp; Jozi.</span>'+
   '<div class="lfoot-links"><button data-action="land-info" data-k="about">About</button><button data-action="land-info" data-k="privacy">Privacy</button><button data-action="land-info" data-k="terms">Terms</button><button data-action="land-info" data-k="contact">Contact</button></div></footer>'+
  '</div>';
  authTab(state.authTab||'login');
  landingLoad()}

function playSeg(){clearTimeout(storyTimer);sPaused=false;
  const f=storyEl&&storyEl.querySelector('.seg i');if(!f)return;
  f.style.transition='none';f.style.width='0%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transition='width '+SDUR+'ms linear';f.style.width='100%'}));
  storyTimer=setTimeout(storyNext,SDUR)}
function pauseStory(){if(!storyEl||sPaused)return;sPaused=true;clearTimeout(storyTimer);
  const f=storyEl.querySelector('.seg i'),s=f.parentElement;
  f.style.transition='none';f.style.width=(f.getBoundingClientRect().width/s.getBoundingClientRect().width*100)+'%'}
function resumeStory(){if(!sPaused||!storyEl)return;sPaused=false;
  const f=storyEl.querySelector('.seg i'),s=f.parentElement;
  const rem=SDUR*(1-f.getBoundingClientRect().width/s.getBoundingClientRect().width);
  f.style.transition='width '+Math.max(rem,50)+'ms linear';f.style.width='100%';
  storyTimer=setTimeout(storyNext,Math.max(rem,50))}
function storyNext(){const sts=feedStories();const si=sts.findIndex(s=>s.uid===storyPos.uid);if(si<0)return closeStory();

  else if(si<sts.length-1){storyPos.uid=sts[si+1].uid;storyPos.ii=0;renderStory()}
  else closeStory()}
function storyPrev(){const sts=feedStories();const si=sts.findIndex(s=>s.uid===storyPos.uid);if(si<0)return;

 'adm-ask'(t){ // open confirmation dialog for a destructive/privileged admin op
  if(!adminState.ok&&!(!REMOTE&&(ME()||{}).role==='admin'))return toast('Admins only.','shield');
  const kind=t.getAttribute('data-kind'),id=t.getAttribute('data-id');
  if(!REMOTE&&['suspend','unsuspend','repRemove','repDismiss','repResolve'].indexOf(kind)<0)

  const M={
    suspend:{t:'Suspend account',b:'<b>'+name+'</b> will be signed out and blocked from the platform until unsuspended.',l:'Suspend account',d:1},
    unsuspend:{t:'Unsuspend account',b:'Restore full access for <b>'+name+'</b>?',l:'Unsuspend',d:0},
    disableLogin:{t:'Disable sign-in',b:'Block <b>'+name+'</b> from signing in. Their profile and content stay visible.'+(adminState.hasLoginCol?'':' (Currently maps to the suspended flag — add the login_disabled column in Settings for a separate switch.)'),l:'Disable login',d:1},
    restoreLogin:{t:'Restore sign-in',b:'Allow <b>'+name+'</b> to sign in again.',l:'Restore login',d:0},
    promote:{t:'Promote to Admin',b:'Grant <b>'+name+'</b> full admin access — user management, moderation and settings.',l:'Promote to Admin',d:0},
    demote:{t:'Remove Admin role',b:'<b>'+name+'</b> will lose admin access immediately.',l:'Remove Admin',d:1},
    delete:{t:'Delete account',b:'Permanently remove all gists, comments, stories, friendships and memberships of <b>'+name+'</b>, then deactivate and anonymise the profile. This cannot be undone.',l:'Delete account',d:1},
    resetAccess:{t:'Reset user access',b:'Unsuspend <b>'+name+'</b> and re-enable sign-in (leaves content untouched).',l:'Reset access',d:0},
    delPost:{t:'Delete gist',b:'Remove this gist and its comments, reactions, shares and saves.',l:'Delete gist',d:1},
    delComment:{t:'Delete comment',b:'Remove this comment permanently.',l:'Delete comment',d:1},
    delGroup:{t:'Delete group',b:'Remove the group, its membership list and all gists posted inside it.',l:'Delete group',d:1},
    delMkt:{t:'Delete listing',b:'Remove this marketplace listing permanently.',l:'Delete listing',d:1},
    suspGroup:{t:'Suspend group',b:'Suspend the group without deleting it (members keep their other data).',l:'Suspend group',d:1},
    repRemove:{t:'Remove reported content',b:'Delete the reported content and mark the report as resolved.',l:'Remove content',d:1},
    repDismiss:{t:'Dismiss report',b:'Close this report without removing any content.',l:'Dismiss',d:0},
    repResolve:{t:'Mark resolved',b:'Close this report as resolved (no content removed).',l:'Mark resolved',d:0}};
  const m=M[kind];if(!m)return;
  adminConfirm({title:m.t,body:m.body,label:m.l,danger:m.d,kind:kind,id:id})},
 async 'adm-confirm'(){
  const o=state.admConfirm;if(!o)return closeModal();
  const{id,kind}=o;closeModal();
  const done=(msg,logType,logDetail)=>{adminLog(kind,logType||'',id,logDetail||'');commit();toast(msg,'shield')};
  if(kind==='suspend'||kind==='unsuspend'){
    const r=await api.adminSuspend(id);
    if(r.err)return toast(r.err,'x');
    done(kind==='suspend'?'Account suspended':'Account unsuspended','user',kind+' @'+((U(id)||{}).username||id))}
  else if(kind==='disableLogin'||kind==='restoreLogin'){
    const r=await api.adminSetLogin(id,kind==='restoreLogin');
    if(r.err)return toast(r.err,'x');
    done(kind==='disableLogin'?'Sign-in disabled':'Sign-in restored','user',kind)}
  else if(kind==='promote'||kind==='demote'){
    const r=await api.adminSetRole(id,kind==='promote');
    if(r.err)return toast(r.err,'x');
    done(kind==='promote'?'Promoted to Admin':'Admin role removed','user',kind+' @'+((U(id)||{}).username||id))}
  else if(kind==='delete'){
    const r=await api.adminDeleteUser(id);
    if(r.err)return toast(r.err,'x');
    done('Account deleted and anonymised','user','soft-deleted @'+((U(id)||{}).username||id))}
  else if(kind==='resetAccess'){
    const patch={suspended:false};if(adminState.hasLoginCol)patch.login_disabled=false;
    const{error}=await SB.from('profiles').update(patch).eq('id',id);
    if(error)return toast(error.message,'x');
    done('Access reset — user can sign in again','user','reset')}
  else if(kind==='delPost'){
    const r=await api.adminDeletePost(id);
    if(r.err)return toast(r.err,'x');
    done('Gist deleted','post',id)}
  else if(kind==='delComment'){
    const r=await api.adminDeleteComment(id);
    if(r.err)return toast(r.err,'x');
    done('Comment deleted','comment',id)}
  else if(kind==='delGroup'){
    const r=await api.adminGroupAction(id,'delete');
    if(r.err)return toast(r.err,'x');
    done('Group deleted','group',id)}
  else if(kind==='suspGroup'){
    const r=await api.adminGroupAction(id,'suspend');
    if(r.err)return toast(r.err,'x');
    done('Group suspended','group',id)}
  else if(kind==='repRemove'){
    const r=await api.adminResolve(id,true);
    if(r.err)return toast(r.err,'x');
    done('Reported content removed and report closed','report',id)}
  else if(kind==='repDismiss'){
    const r=await api.adminResolve(id,false);
    if(r.err)return toast(r.err,'x');
    done('Report dismissed','report',id)}
  else if(kind==='delMkt'){
    const r=await admWrite(SB.from('marketplace_listings').delete().eq('id',id));
    if(r.err)return toast(r.err,'x');
    await mktRefresh();adminLog('delMkt','listing',id,'listing removed');toast('Listing deleted','trash')}
  else if(kind==='repResolve'){
    if(!REMOTE){const r=(D.reports||[]).find(x=>x.id===id);if(r){r.done=true;await DB.put('reports',r)}}
    else{const r=await admWrite(SB.from('reports').update({done:true}).eq('id',id));
      if(r.err)return toast(r.err,'x')}
    done('Report marked resolved','report',id)}},

 msgSend(cid,input,img){const text=input?input.value:'';

 mdel(t){(async()=>{const r=await api.deleteMessage(t.getAttribute('data-id'));

 'group-photo'(){pickFile(async f=>{try{state.gPhoto=await addImage(f,'groups');const b=document.querySelector('[data-action="group-photo"]');if(b)b.textContent='Photo chosen ✔'}catch(e){}})},
 'group-create-save'(){(async()=>{const n=document.getElementById('gn').value.trim();

  state.gPhoto=null;closeModal();state.view='group';state.gid=r.id;state.gtab='posts';await commit();toast('"'+n+'" is live. Invite the troops!','flag')})()},
 'group-edit'(t){const g=G(t.getAttribute('data-id'));if(!g||gRole(g.id,auth.uid)!=='owner')return;
  openModal('<div class="mo-h"><h3>Edit group</h3><button class="ibtn" data-action="modal-x">'+icon('x')+'</button></div>'+

  '<div class="field"><label>Description</label><textarea id="geD" rows="2">'+esc(g.desc||'')+'</textarea></div>'+

  '<button class="btn pri" style="width:100%" data-action="group-edit-save" data-id="'+g.id+'">Save</button></div>')},
 'group-edit-save'(t){(async()=>{const r=await api.updateGroup(t.getAttribute('data-id'),{name:document.getElementById('geN').value.trim(),desc:document.getElementById('geD').value.trim(),privacy:document.getElementById('geP').value});
  if(r.err)return toast(r.err,'x');closeModal();await commit();toast('Group updated','check')})()},
 gtab(t){state.gtab=t.getAttribute('data-tab');renderMain()},
 ptab(t){state.ptab=t.getAttribute('data-tab');renderMain()},
 'edit-profile'(){const u=ME();openModal('<div class="mo-h"><h3>Edit profile</h3><button class="ibtn" data-action="modal-x">'+icon('x')+'</button></div>'+
  '<div class="mo-b"><div class="field"><label for="epn">Display name</label><input id="epn" value="'+esc(u.name)+'"></div>'+
  '<div class="field"><label for="epb">Bio</label><textarea id="epb" rows="2" maxlength="160">'+esc(u.bio||'')+'</textarea></div>'+
  '<div class="frow2"><div class="field"><label>Country</label><input id="epc" value="'+esc(u.country||'')+'"></div><div class="field"><label>City</label><input id="epci" value="'+esc(u.city||'')+'"></div></div>'+
  '<div class="frow2"><div class="field"><label>Gender</label><select id="epg"><option value="">Prefer not to say</option><option '+(u.gender==='Female'?'selected':'')+'>Female</option><option '+(u.gender==='Male'?'selected':'')+'>Male</option><option '+(u.gender==='Other'?'selected':'')+'>Other</option></select></div>'+
  '<div class="field"><label>Birthday</label><input id="epbd" type="date" value="'+esc(u.birthday||'')+'"></div></div>'+
  '<button class="btn pri" style="width:100%" data-action="edit-save">'+icon('check','s')+' Save changes</button></div>')},
 'edit-save'(){(async()=>{const r=await api.updateProfile({displayName:document.getElementById('epn').value,bio:document.getElementById('epb').value.trim(),country:document.getElementById('epc').value.trim(),city:document.getElementById('epci').value.trim(),gender:document.getElementById('epg').value,birthday:document.getElementById('epbd').value});
  if(r.err)return toast(r.err,'x');closeModal();await commit();toast('Profile updated. Looking sharp.','check')})()},
 'ava-upload'(){pickFile(async f=>{try{const url=await addImage(f,'avatars');
  const r=await api.updateProfile({photoId:url});if(r.err)return toast(r.err,'x');
  await commit();toast('Profile photo updated','camera')}catch(e){}})},
 'cov-upload'(){pickFile(async f=>{try{const url=await addImage(f,'covers');
  const r=await api.updateProfile({coverId:url});if(r.err)return toast(r.err,'x');
  await commit();toast('Cover updated','camera')}catch(e){}})},
 'story-new'(){openStoryComposer()},
 'story-bg'(t){state.storyDraft.bg=+t.getAttribute('data-bg');
  document.querySelectorAll('.bgopt').forEach(b=>b.classList.toggle('on',+b.getAttribute('data-bg')===state.storyDraft.bg));
  const sv=document.getElementById('svp');if(sv){sv.style.background=SBG[state.storyDraft.bg].c;const tx=document.getElementById('svpt');if(tx)tx.style.color=SBG[state.storyDraft.bg].t}},
 'story-photo'(){pickFile(async f=>{try{state.storyDraft.img=await addImage(f,'stories');const sv=document.getElementById('svp');if(sv)sv.style.backgroundImage='url('+imgSrc(state.storyDraft.img)+')'}catch(e){}})},
 'story-post'(){(async()=>{const txt=(document.getElementById('storyText')||{}).value||'';
  const r=await api.createStory({text:txt,bg:state.storyDraft.bg||0,imageId:state.storyDraft.img||null});
  if(r.err)return toast(r.err,'x');
  state.storyDraft={bg:0,text:'',img:null};closeModal();await commit();toast('Your story is live for 24 hours','sparkle')})()},
 'story-open'(t){storyPos.uid=t.getAttribute('data-uid');storyPos.ii=0;renderStory()},
 'story-next'(){storyNext()},'story-prev'(){storyPrev()},
 'story-close'(){closeStory();renderMain()},
 'story-views'(t){const vs=(D.storyViews||[]).filter(v=>v.storyId===t.getAttribute('data-sid'));
  pop('sv','<div class="pop-h"><b>Story views</b><span style="font-size:12px;color:var(--muted)">'+vs.length+'</span></div>'+
  '<div style="max-height:280px;overflow-y:auto;min-width:220px">'+(vs.map(v=>{const u=U(v.viewer);return u?'<div class="mrow">'+avatar(u,30)+' '+esc(u.name)+'</div>':''}).join('')||'<p style="padding:14px;color:var(--muted);font-size:13px">No views yet.</p>')+'</div>',t)},
 bell(t){const list=(D.notifications||[]).filter(n=>n.uid===auth.uid).sort((a,b)=>b.createdAt-a.createdAt).slice(0,20);
  pop('bell','<div class="pop-h"><b>Notifications</b><button class="lnk" data-action="markread">Mark all read</button></div>'+
  '<div class="nlist">'+(list.map(n=>{const a=U(n.actorId);
   return'<button class="nrow '+(n.read?'':'un')+'" data-action="notif-open" data-id="'+n.id+'">'+
   (a?avatar(a,36):'<span class="nico">'+icon('bell','s')+'</span>')+
   '<span class="ntx"><b>'+esc(a?a.name:'GistHubAfrica')+'</b> '+esc(n.text)+' <span class="ts" data-ts="'+n.createdAt+'">'+ago(n.createdAt)+'</span></span>'+
   (n.read?'':'<i class="ndot"></i>')+'</button>'}).join('')||'<p style="padding:16px;color:var(--muted)">Nothing yet — go and make some noise.</p>')+'</div>'+
  '<div class="pop-foot">That is everything for now.</div>',t)},
 markread(){(async()=>{await api.markAllRead();await loadSnapshot();
  const b=document.querySelector('[data-action="bell"]');if(b)ACTIONS.bell(b);updateBadges()})()},
 'notif-open'(t){(async()=>{await api.markNotifRead(t.getAttribute('data-id'));
  const n=(D.notifications||[]).find(x=>x.id===t.getAttribute('data-id'));
  closePops();await loadSnapshot();
  if(n&&n.ref){
   if(n.ref.k==='post')goFeedAndFlash(n.ref.id);
   else if(n.ref.k==='friends'){state.view='friends';state.ftab='requests';renderMain()}
   else if(n.ref.k==='chat'){const c=(D.conversations||[]).find(x=>x.id===n.ref.id);const p=c&&convPartner(c);if(p)openChatWith(p.id)}
   else if(n.ref.k==='group'){state.view='group';state.gid=n.ref.id;renderMain()}}
  updateBadges()})()},
 'jump-post'(t){goFeedAndFlash(t.getAttribute('data-id'))},
};

/* ---------- global listeners ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!e.target.closest('.searchwrap')){const qr=document.getElementById('qres');if(qr)qr.hidden=true}
  if(!e.target.closest('.popover')&&!(t&&t.hasAttribute('data-pop')))closePops();
  if(!t)return;
  const fn=ACTIONS[t.getAttribute('data-action')];if(fn)fn(t,e)});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='compText'){state.composer.text=el.value;el.style.height='auto';el.style.height=el.scrollHeight+'px';
   const b=document.querySelector('[data-action="comp-post"]');if(b)b.disabled=!el.value.trim()&&!state.composer.img}
  else if(el.classList&&el.classList.contains('cinput'))state.drafts[el.getAttribute('data-post')]=el.value;
  else if(el.id==='storyText'){state.storyDraft.text=el.value;const pt=document.getElementById('svpt');if(pt)pt.textContent=el.value||'Start typing…';const go=document.getElementById('storyGo');if(go)go.disabled=!el.value.trim()&&!state.storyDraft.img}});
document.getElementById('filepick').addEventListener('change',e=>{const f=e.target.files[0];if(f&&pickCb)pickCb(f,pickCtx);e.target.value=''});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
   if(e.target.classList&&e.target.classList.contains('cinput')){e.preventDefault();ACTIONS.commentSend(e.target.getAttribute('data-post'),e.target)}
   else if(e.target.classList&&e.target.classList.contains('chin')){e.preventDefault();ACTIONS.msgSend(e.target.getAttribute('data-cid'),e.target)}}
  if(e.key==='Escape'){if(storyEl)closeStory();else{closeModal();closePops();document.querySelectorAll('.lb').forEach(x=>x.remove())}}
  if(storyEl&&e.key==='ArrowRight')storyNext();
  if(storyEl&&e.key==='ArrowLeft')storyPrev();
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();const q=document.getElementById('q');if(q)q.focus()}});
let hT=null;
document.addEventListener('pointerover',e=>{const w=e.target.closest('.react-wrap');clearTimeout(hT);
  if(w){if(!w.classList.contains('show'))hT=setTimeout(()=>w.classList.add('show'),350)}
  else document.querySelectorAll('.react-wrap.show').forEach(x=>x.classList.remove('show'))});
document.addEventListener('pointerdown',e=>{
  if(storyEl&&e.target.closest('.sv-stage')){sPauseT=setTimeout(pauseStory,170);return}
  if(e.pointerType!=='mouse'){const b=e.target.closest('[data-action="like"]');
   if(b){const w=b.closest('.react-wrap');hT=setTimeout(()=>{if(w)w.classList.add('show')},350)}}});
document.addEventListener('pointerup',()=>{clearTimeout(hT);if(sPaused)resumeStory();else clearTimeout(sPauseT)});
window.addEventListener('scroll',()=>{closePops();document.querySelectorAll('.react-wrap.show').forEach(x=>x.classList.remove('show'))},{passive:true});
window.addEventListener('resize',closePops);
setInterval(()=>{document.querySelectorAll('[data-ts]').forEach(el=>{el.textContent=ago(+el.getAttribute('data-ts'))})},30000);
setInterval(async()=>{if(!auth.uid)return;
  try{if(REMOTE){await loadSnapshot()}else{await api.touch();await loadSnapshot()}
   updateBadges();renderDock(true)}catch(e){}},5000);
setInterval(()=>{api.touch()},60000);
window.addEventListener('error',e=>console.error('[GHA]',e.message));
window.addEventListener('unhandledrejection',e=>console.error('[GHA]',e.reason));

/* ---------- boot (guarded — never blank) ---------- */
function fatalScreen(err){
  console.error('[GistHubAfrica] boot failed:',err);
  document.getElementById('app').innerHTML='<div class="authwrap"><div class="authside"><div class="card auth"><div class="kente"></div><div class="auth-in"><h2>Almost there</h2><p class="sub">The app could not fully start (check the console for details). Reload to continue.</p><button class="btn pri" style="width:100%" onclick="location.reload()">Reload GistHubAfrica</button></div></div></div></div>'}
async function boot(){
  if(REMOTE){
    const r=await initRemote();
    if(r&&r.err){await loadSnapshot();renderAll();toast(r.err,'x');return}
    await loadSnapshot();renderAll();wireRealtime();return;
  }
  await loadSnapshot();
  const meta=(await DB.get('meta','meta'))||{id:'meta'};
  if(!meta.seeded&&!meta.demoRemoved){await seedDemo();await loadSnapshot()}
  else{await freshenDemo();await loadSnapshot()}
  const s=getSession();
  if(s){const u=await DB.get('users',s.uid);
   if(!u||(u.suspended&&!isDemo(u.id))){clearSession()}
   else{auth.uid=u.id;u.lastSeen=Date.now();await DB.put('users',u)}}
  else{const em=await DB.get('users','demo_emmanuel');
   if(em&&!meta.demoRemoved){setSession(em);auth.uid=em.id}}
  renderAll()}
(async function init(){
  try{if(LS.get('gha-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}
  try{await boot()}
  catch(err){fatalScreen(err)}
})();
</script>
